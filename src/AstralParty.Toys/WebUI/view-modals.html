      <!-- Global Modal Window (Game Themed) -->
      <div class="modal-backdrop" id="globalModal" inert>
        <div
          class="modal-content"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modalTitle"
        >
          <div class="modal-header">
            <h3 id="modalTitle">详情</h3>
            <button
              class="modal-close-btn"
              id="modalCloseBtn"
              aria-label="关闭"
            >
              ×
            </button>
          </div>
          <div class="modal-body" id="modalBody"></div>
        </div>
      </div>

      <!-- Loading Overlay (Game Themed) -->
      <div class="modal-backdrop hidden loading-backdrop" id="loadingOverlay">
        <div class="loading-card">
          <div
            style="
              width: 40px;
              height: 40px;
              border: 4px solid rgba(255, 255, 255, 0.1);
              border-top-color: var(--gp-pink);
              border-radius: 50%;
              animation: spin 0.8s linear infinite;
            "
          ></div>
          <strong
            id="loadingText"
            style="font-size: 16px; font-weight: 800; letter-spacing: 0.5px"
            >正在解析回放…</strong
          >
          <span style="font-size: 12px; color: var(--gp-text-sub)"
            >正在处理，请稍候</span
          >
        </div>
      </div>

      <!-- Toast -->
      <div
        class="toast-container"
        id="toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>

      <!-- 右下角常驻操作提示：停用/启用/删除等需要等待的操作 -->
      <div class="op-toast" id="opToast" role="status" aria-live="polite">
        <span class="op-spinner" aria-hidden="true"></span>
        <div class="op-toast-text">
          <strong id="opToastTitle">正在处理…</strong>
          <span id="opToastDetail"></span>
        </div>
        <span class="op-toast-percent" id="opToastPercent"></span>
        <button class="op-toast-cancel hidden" id="opToastCancel">取消</button>
      </div>

      <!-- 市场安装进度（右下角，切到其它页面也能看到） -->
      <div class="wit" id="workshopInstallToast" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true">
        <div class="wit-head">
          <span class="mi" data-icon="download"></span>
          <div class="wit-heading">
            <strong id="workshopInstallTitle">正在安装…</strong>
            <span id="workshopInstallSubtitle"></span>
          </div>
          <span class="wit-percent" id="workshopInstallPercent"></span>
          <button class="wit-close" id="workshopInstallClose" aria-label="关闭">×</button>
        </div>
        <ol class="wit-steps" id="workshopInstallSteps">
          <li data-phase="download"><span class="wit-dot"></span><span class="wit-label"></span></li>
          <li data-phase="verify"><span class="wit-dot"></span><span class="wit-label"></span></li>
          <li data-phase="install"><span class="wit-dot"></span><span class="wit-label"></span></li>
        </ol>
        <div class="wit-bar"><span id="workshopInstallBar"></span></div>
        <div class="wit-foot">
          <span class="wit-text" id="workshopInstallText"></span>
          <button class="wit-cancel" id="workshopInstallCancel">取消</button>
        </div>
      </div>
    </div>
