name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT: src/AstralParty.Toys/AstralParty.Toys.csproj
  TEST_PROJECT: tests/AstralParty.Toys.Tests/AstralParty.Toys.Tests.csproj
  APP_NAME: AstralParty.Toys
  DOTNET_VERSION: 8.0.x

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 测试自带合成回放数据，不需要玩家目录或联网素材
      - name: Run tests
        shell: pwsh
        run: dotnet test $env:TEST_PROJECT --configuration Release --nologo

  build:
    name: Build ${{ matrix.rid }} ${{ matrix.kind }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64]
        kind:
          - framework-zip
          - self-contained-zip
          - framework-single
          - self-contained-single
          - framework-installer
          - self-contained-installer

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 内嵌 Mod 加载器始终取自 CesiumLoader 最新 Release（github.com/higashitaniyume/CesiumLoader）：
      # 直接把这个发布包塞进 Resources\ModLoader\ 后构建，无需手动同步，也不再逐文件挑选。
      - name: Fetch latest CesiumLoader package
        shell: pwsh
        run: |
          $zipUrl = "https://github.com/higashitaniyume/CesiumLoader/releases/latest/download/cesium-loader.zip"
          $zipPath = "$env:TEMP/cesium-loader-latest.zip"
          # GitHub /releases/latest/download may intermittently return 504 (observed across parallel matrix jobs).
          # Retry with backoff instead of failing the whole release on one thundering-herd download.
          $attempt = 0
          $maxAttempts = 5
          $downloaded = $false
          while (-not $downloaded -and $attempt -lt $maxAttempts) {
            $attempt++
            try {
              Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UseBasicParsing
              $downloaded = $true
            } catch {
              if ($attempt -ge $maxAttempts) { throw }
              $delaySeconds = 10 * $attempt + (Get-Random -Minimum 0 -Maximum 10)
              Write-Host "Download attempt $attempt failed ($($_.Exception.Message)), retry in ${delaySeconds}s"
              Start-Sleep -Seconds $delaySeconds
            }
          }
          if (-not $downloaded) { throw "Failed to download CesiumLoader package." }
          # 直接把整包塞进 Resources\ModLoader\：程序集只内嵌这一个 CesiumLoader 发布包，
          # 「安装 / 重新安装内置版本」= 解压它（与「导入发布包」同一条代码路径）。
          # 包内版本号、SDK 版本、内置 mod 清单与加载器更新日志都在运行时从包里读，
          # 因此这里不需要再逐文件同步，也不存在第二份会和发布包漂移的清单。
          $resources = "src/AstralParty.Toys/Resources/ModLoader"
          $target = "$resources/cesium-loader.zip"
          Copy-Item $zipPath $target -Force

          # 坏包不能塞进程序集：必须有清单与 version.dll，且清单里声明的每个文件都在包里。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $target))
          try {
            $entryNames = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($entryNames -notcontains "cesium-loader.json") { throw "发布包缺少 cesium-loader.json 清单" }
            if ($entryNames -notcontains "version.dll") { throw "发布包缺少 version.dll" }
            $manifestEntry = $archive.Entries | Where-Object { $_.FullName -eq "cesium-loader.json" }
            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            $missing = @($manifest.files.PSObject.Properties.Name | Where-Object { $entryNames -notcontains $_ })
            if ($missing.Count -gt 0) { throw "发布包清单里声明的文件缺失: $($missing -join ', ')" }
            $modFiles = @($entryNames | Where-Object { $_ -match '^AstralParty_ModLoader/mods/[^/]+/[^/]+' })
            Write-Host "内嵌发布包: CesiumLoader $($manifest.version)（$($entryNames.Count) 个条目，mods 下 $($modFiles.Count) 个文件）"
          } finally { $archive.Dispose() }

          Get-ChildItem "src/AstralParty.Toys/Resources/ModLoader" | Select-Object Name, Length

      - name: Resolve package metadata
        id: metadata
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "manual-${{ github.run_number }}"
          }
          $safeVersion = $version -replace '[^0-9A-Za-z._-]', '-'
          $selfContained = "${{ contains(matrix.kind, 'self-contained') }}".ToLowerInvariant()
          $singleFile = "${{ contains(matrix.kind, 'single') }}".ToLowerInvariant()
          $runtimeLabel = if ($selfContained -eq "true") { "self-contained" } else { "framework-dependent" }
          $formatLabel = if ("${{ contains(matrix.kind, 'installer') }}" -eq "true") { "installer" } elseif ($singleFile -eq "true") { "single-file" } else { "portable" }
          $baseName = "${{ env.APP_NAME }}-$safeVersion-${{ matrix.rid }}-$runtimeLabel-$formatLabel"
          "version=$safeVersion" >> $env:GITHUB_OUTPUT
          "self_contained=$selfContained" >> $env:GITHUB_OUTPUT
          "single_file=$singleFile" >> $env:GITHUB_OUTPUT
          "base_name=$baseName" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:PROJECT --runtime "${{ matrix.rid }}"

      - name: Publish
        shell: pwsh
        run: |
          $arguments = @(
            "publish", $env:PROJECT,
            "--configuration", "Release",
            "--runtime", "${{ matrix.rid }}",
            "--self-contained", "${{ steps.metadata.outputs.self_contained }}",
            "--no-restore",
            "--output", "publish",
            "-p:DebugType=None",
            "-p:DebugSymbols=false",
            "-p:PublishSingleFile=${{ steps.metadata.outputs.single_file }}"
          )
          if ("${{ steps.metadata.outputs.single_file }}" -eq "true") {
            $arguments += "-p:IncludeAllContentForSelfExtract=true"
            if ("${{ steps.metadata.outputs.self_contained }}" -eq "true") {
              $arguments += "-p:EnableCompressionInSingleFile=true"
            }
          }
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Inno Setup
        if: contains(matrix.kind, 'installer')
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --version=6.6.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found." }
          "INNO_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Build x64 Inno installer
        if: contains(matrix.kind, 'installer')
        shell: pwsh
        run: |
          [xml]$project = Get-Content $env:PROJECT -Raw
          $productVersion = [string]$project.Project.PropertyGroup.Version
          ./installer/Build-Installer.ps1 -PublishDirectory publish -OutputPath "artifacts/${{ steps.metadata.outputs.base_name }}.exe" -ProductVersion $productVersion -CompilerPath $env:INNO_COMPILER

      - name: Package release asset
        if: "!contains(matrix.kind, 'installer')"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $baseName = "${{ steps.metadata.outputs.base_name }}"
          if ("${{ steps.metadata.outputs.single_file }}" -eq "true") {
            $files = @(Get-ChildItem publish -File)
            if ($files.Count -ne 1 -or $files[0].Extension -ne ".exe") {
              throw "Single-file publish must contain exactly one EXE. Found: $($files.Name -join ', ')"
            }
            Move-Item $files[0].FullName "artifacts/$baseName.exe"
          } else {
            Compress-Archive -Path "publish/*" -DestinationPath "artifacts/$baseName.zip" -CompressionLevel Optimal
          }

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.base_name }}
          path: |
            artifacts/*.zip
            artifacts/*.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate version manifest (version.json)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $repo = "${{ github.repository }}"

          # 每种发布形态一项：安装版跑安装程序，单文件版和便携版由程序在退出后原地替换（AppSelfUpdater）
          $kinds = [ordered]@{
            frameworkDependentInstaller  = "*-framework-dependent-installer.exe"
            selfContainedInstaller       = "*-self-contained-installer.exe"
            frameworkDependentSingleFile = "*-framework-dependent-single-file.exe"
            selfContainedSingleFile      = "*-self-contained-single-file.exe"
            frameworkDependentPortable   = "*-framework-dependent-portable.zip"
            selfContainedPortable        = "*-self-contained-portable.zip"
          }
          $packages = [ordered]@{}
          foreach ($key in $kinds.Keys) {
            $file = @(Get-ChildItem artifacts -Filter $kinds[$key])
            if ($file.Count -ne 1) {
              throw "Expected exactly one $($kinds[$key]) in artifacts, found $($file.Count)"
            }
            $packages[$key] = [ordered]@{
              fileName = $file[0].Name
              url = "https://github.com/$repo/releases/download/$tag/$($file[0].Name)"
              sha256 = (Get-FileHash -Path $file[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              size = $file[0].Length
            }
          }

          $manifest = [ordered]@{
            version = $version
            releaseTag = $tag
            releaseDate = $date
            releaseNotes = ""
            packages = $packages
          }

          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText("artifacts/version.json", $json, [System.Text.Encoding]::UTF8)
          Write-Host "Generated artifacts/version.json:"
          Write-Host $json

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -maxdepth 1 -type f -print | sort)
          printf '%s\n' "${assets[@]}"
          test "${#assets[@]}" -eq 7
          test "$(find artifacts -maxdepth 1 -type f -name '*.msi' | wc -l)" -eq 0
          test "$(find artifacts -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 4
          test "$(find artifacts -maxdepth 1 -type f -name '*-installer.exe' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name 'version.json' | wc -l)" -eq 1

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
