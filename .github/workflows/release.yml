name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT: src/AstralParty.Toys/AstralParty.Toys.csproj
  TEST_PROJECT: tests/AstralParty.Toys.Tests/AstralParty.Toys.Tests.csproj
  APP_NAME: AstralParty.Toys
  DOTNET_VERSION: 8.0.x

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 测试自带合成回放数据，不需要玩家目录或联网素材
      - name: Run tests
        shell: pwsh
        run: dotnet test $env:TEST_PROJECT --configuration Release --nologo

  build:
    name: Build ${{ matrix.rid }} ${{ matrix.kind }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x86, win-x64]
        kind: [framework-zip, self-contained-zip, framework-single, self-contained-single]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 内嵌 Mod 加载器始终取自 CesiumLoader 最新 Release（github.com/higashitaniyume/CesiumLoader）
      # 下载 cesium-loader.zip → 解压 → 覆盖 Resources\ModLoader\ 后构建，无需手动同步。
      - name: Fetch latest CesiumLoader package
        shell: pwsh
        run: |
          $zipUrl = "https://github.com/higashitaniyume/CesiumLoader/releases/latest/download/cesium-loader.zip"
          $zipPath = "$env:TEMP/cesium-loader-latest.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UseBasicParsing
          $extract = "$env:TEMP/cesium-loader-latest"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zipPath -DestinationPath $extract -Force
          $targets = @(
            @{ From = "$extract/winmm.dll"; To = "src/AstralParty.Toys/Resources/ModLoader/winmm.dll" },
            @{ From = "$extract/AstralParty_ModLoader/sdk/CesiumLoader.SDK.dll"; To = "src/AstralParty.Toys/Resources/ModLoader/CesiumLoader.SDK.dll" },
            @{ From = "$extract/AstralParty_ModLoader/mods/ActivityLogMod.dll"; To = "src/AstralParty.Toys/Resources/ModLoader/ActivityLogMod.dll" }
          )
          foreach ($t in $targets) {
            if (-not (Test-Path $t.From)) { throw "解压包缺少文件: $($t.From)" }
            Copy-Item $t.From $t.To -Force
          }
          # 记录内嵌加载器版本（ModManager 读取显示/更新对比）
          if (Test-Path "$extract/cesium-loader.json") {
            $manifest = Get-Content "$extract/cesium-loader.json" -Raw | ConvertFrom-Json
            $version = if ($manifest.version) { $manifest.version } else { "unknown" }
          } else {
            $version = "unknown"
          }
          Set-Content -Path "src/AstralParty.Toys/Resources/ModLoader/loader-version.json" -Value ($version | ConvertTo-Json) -Encoding UTF8
          Write-Host "内嵌加载器版本: $version"
          Get-ChildItem "src/AstralParty.Toys/Resources/ModLoader" | Select-Object Name, Length

      - name: Resolve package metadata
        id: metadata
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "manual-${{ github.run_number }}"
          }
          $safeVersion = $version -replace '[^0-9A-Za-z._-]', '-'
          $selfContained = "${{ contains(matrix.kind, 'self-contained') }}".ToLowerInvariant()
          $singleFile = "${{ contains(matrix.kind, 'single') }}".ToLowerInvariant()
          $runtimeLabel = if ($selfContained -eq "true") { "self-contained" } else { "framework-dependent" }
          $formatLabel = if ($singleFile -eq "true") { "single-file" } else { "portable" }
          $baseName = "${{ env.APP_NAME }}-$safeVersion-${{ matrix.rid }}-$runtimeLabel-$formatLabel"
          "version=$safeVersion" >> $env:GITHUB_OUTPUT
          "self_contained=$selfContained" >> $env:GITHUB_OUTPUT
          "single_file=$singleFile" >> $env:GITHUB_OUTPUT
          "base_name=$baseName" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:PROJECT --runtime "${{ matrix.rid }}"

      - name: Publish
        shell: pwsh
        run: |
          $arguments = @(
            "publish", $env:PROJECT,
            "--configuration", "Release",
            "--runtime", "${{ matrix.rid }}",
            "--self-contained", "${{ steps.metadata.outputs.self_contained }}",
            "--no-restore",
            "--output", "publish",
            "-p:DebugType=None",
            "-p:DebugSymbols=false",
            "-p:PublishSingleFile=${{ steps.metadata.outputs.single_file }}"
          )
          if ("${{ steps.metadata.outputs.single_file }}" -eq "true") {
            $arguments += "-p:IncludeAllContentForSelfExtract=true"
            if ("${{ steps.metadata.outputs.self_contained }}" -eq "true") {
              $arguments += "-p:EnableCompressionInSingleFile=true"
            }
          }
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $baseName = "${{ steps.metadata.outputs.base_name }}"
          if ("${{ steps.metadata.outputs.single_file }}" -eq "true") {
            $files = @(Get-ChildItem publish -File)
            if ($files.Count -ne 1 -or $files[0].Extension -ne ".exe") {
              throw "Single-file publish must contain exactly one EXE. Found: $($files.Name -join ', ')"
            }
            Move-Item $files[0].FullName "artifacts/$baseName.exe"
          } else {
            Compress-Archive -Path "publish/*" -DestinationPath "artifacts/$baseName.zip" -CompressionLevel Optimal
          }

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.base_name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -maxdepth 1 -type f -print | sort)
          printf '%s\n' "${assets[@]}"
          test "${#assets[@]}" -eq 8
          test "$(find artifacts -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 4
          test "$(find artifacts -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 4

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
